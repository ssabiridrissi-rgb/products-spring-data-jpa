spring.application.name=students-app
server.port=8085

# Base H2 en mémoire (console : http://localhost:8085/h2-console)
spring.datasource.url=jdbc:h2:mem:product-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Pour utiliser MySQL à la place, ajouter la dépendance com.mysql:mysql-connector-j
# puis remplacer la configuration ci-dessus par :
# spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/products-db?createDatabaseIfNoExist=true
# spring.datasource.username=${MYSQL_USER:root}
# spring.datasource.password=${MYSQL_PWD:}
